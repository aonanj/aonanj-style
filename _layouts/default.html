<!doctype html>
<html lang="{{ site.lang | default: 'en' | escape }}">
  {% include aonanj-style/metadata.html %}
  {% include aonanj-style/head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      {% include aonanj-style/header.html %}
      <main id="main-content" class="card body-card" tabindex="-1">
        <article class="readme" data-readme>{{ content }}</article>
      </main>
      {% include aonanj-style/footer.html %}
    </div>
    <script src="{{ '/assets/js/aonanj-style.js' | relative_url }}" defer></script>
  </body>
</html>
