name: Theme checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test a separate remote-theme consumer
        run: bundle exec ruby test/build_test.rb
      - name: Test browser enhancements
        run: npm test
      - name: Build this repository's README site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check generated content, links, and assets
        run: npm run test:rendered
